<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>جارٍ تسجيل الدخول…</title>
<style>
  body{font-family:Tahoma,Arial,sans-serif;background:#faf6ec;color:#12284c;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}
  .box{padding:24px}
  .spin{width:40px;height:40px;border:4px solid #e8dfc6;border-top-color:#c9a227;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}
  @keyframes s{to{transform:rotate(360deg)}}
  a{color:#12284c;font-weight:bold}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <p id="msg">جارٍ تسجيل الدخول…</p>
  <noscript><p>يلزم تفعيل JavaScript لإكمال تسجيل الدخول.</p></noscript>
</div>
<script>
(function () {
  // رابط المنصة (Web app URL) — يجب أن يطابق رابط النشر الحالي وينتهي بـ /exec
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzeWyU4RMZqvIH0rffaMI_jtErG3rzF3__2oyZs7LmFhzEAhtnVCFzXz2gzfz_1Nxe1/exec';

  // حماية: لا يُحوَّل الزائر إلا إلى رابط Apps Script بالشكل المتوقع
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(APP_URL)) {
    document.getElementById('msg').textContent = 'إعداد الصفحة غير صحيح.';
    return;
  }
  var q = new URLSearchParams(location.search), out = [];
  // يُمرَّر فقط ما تحتاجه المنصة. لا يُمرَّر authuser ولا أي معامل آخر.
  ['code', 'state', 'error'].forEach(function (k) {
    var v = q.get(k);
    if (v && v.length < 2048) out.push(k + '=' + encodeURIComponent(v));
  });
  if (!q.get('state') || (!q.get('code') && !q.get('error'))) {
    document.getElementById('msg').innerHTML = 'رابط غير صالح. <a href="' + APP_URL + '">العودة إلى المنصة</a>';
    return;
  }
  location.replace(APP_URL + '?' + out.join('&'));
})();
</script>
</body>
</html>
